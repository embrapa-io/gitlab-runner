services:
  runner:
    image: gitlab/gitlab-runner:alpine-v19.0.2 # manter SEMPRE na mesma versão do GitLab (git.embrapa.io)
    restart: always
    volumes:
      - ./config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    post_start:
      - command: sh -c 'grep -q "\[\[runners\]\]" /etc/gitlab-runner/config.toml 2>/dev/null || /usr/bin/gitlab-runner register --non-interactive --url ${GITLAB_URL} --token ${RUNNER_TOKEN} --executor docker --docker-image alpine:latest'

  cleaner:
    build:
      context: .
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
